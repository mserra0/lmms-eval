dataset_path: hal-utokyo/MangaVQA
# dataset_name: MangaVQA
task: "manga_vqa_test"
dataset_kwargs:
  token: True
test_split: test
output_type: generate_until
doc_to_visual: !function utils.mangavqa_doc_to_visual
doc_to_text: !function utils.mangavqa_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: False
process_results: !function utils.mangavqa_test_process_results
metric_list:
  - metric: submission
    aggregation: !function utils.mangavqa_test_aggregate_results
    higher_is_better: true
  - metric: anls
    aggregation: mean
    higher_is_better: true
  - metric: f1
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
    regexes_to_ignore:
      - ","
      - "\\$"
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer the question using a single word or phrase."
  qwen_vl:
    pre_prompt: ""
    post_prompt: " Answer:"
metadata:
  - version: 0.0